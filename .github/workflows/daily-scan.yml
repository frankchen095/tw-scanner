name: 台股盤後掃描

on:
  schedule:
    - cron: "0 13 * * 1-5"   # 台灣時間週一~週五 21:00(UTC 13:00)。注意:GitHub 的排程常比設定時間晚幾小時才啟動
  workflow_dispatch:         # 在 GitHub 網頁上手動觸發;dry_run 打勾 = 只跑完整流程、印在記錄裡,不推播
    inputs:
      dry_run:
        description: "只跑完整流程並印出結果,不推播 LINE"
        type: boolean
        default: false
      force:
        description: "這天的報表已經推播過了,還是要再推一次"
        type: boolean
        default: false

permissions:
  contents: write

# 同一時間只跑一個。晚到的排程如果看到今天已經推播過,會自己跳過,不會重複推播。
concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 240  # 市值表常比其他資料晚更新,程式最多會等 150 分鐘
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: 執行盤後掃描
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python scripts/main.py ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.force && '--force' || '' }}

      # 就算推播失敗,當天抓到的資料也要存回 repo,不然隔天的「近5日」「連買天數」會斷掉
      - name: 把當天資料存回 repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/scanner.db
          git diff --staged --quiet || git commit -m "資料更新: $(date -u +%Y-%m-%d)"
          git push
